<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claire | Staff Product Designer, B2B SaaS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#e2e7ec; --ink:#14202b; --muted:#566574; --line:#c5ced7; --accent:#0e6f63; --accent-ink:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10171d;--surface:#1a242d;--ink:#e8edf1;--muted:#98a7b4;--line:#2d3b47;--accent:#4fc3b0;--accent-ink:#0b1a17;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10171d;--surface:#1a242d;--ink:#e8edf1;--muted:#98a7b4;--line:#2d3b47;--accent:#4fc3b0;--accent-ink:#0b1a17;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
header .name{font:700 20px "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:24px}
nav a{text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.hero{padding:72px 0 56px}
.hero h1{font-size:clamp(44px,9vw,104px);max-width:12ch}
.hero p{font-size:clamp(18px,2.2vw,22px);color:var(--muted);max-width:52ch;margin:28px 0 0}
.status{display:inline-flex;gap:10px;align-items:center;margin-top:28px;padding:8px 14px;background:var(--surface);border-radius:999px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.work{border-top:1px solid var(--line);margin-top:24px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 32px;padding:32px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row h2{font-size:clamp(26px,4vw,40px)}
.row p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.row .meta{color:var(--muted);font-size:15px;text-align:right;align-self:start;padding-top:8px}
.row:hover h2{color:var(--accent)}
.row:hover{background:linear-gradient(var(--surface),var(--surface)) no-repeat left/0 0}
.crumb{display:inline-block;margin:24px 0 0;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--ink)}
.case-head{padding:32px 0 40px;border-bottom:1px solid var(--line)}
.case-head h1{font-size:clamp(38px,7vw,76px);max-width:16ch}
.case-head .lede{font-size:21px;color:var(--muted);max-width:56ch;margin:20px 0 0}
dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:32px 0 0}
dl.facts dt{color:var(--muted);font-size:14px}
dl.facts dd{margin:2px 0 0;font-weight:500}
.shot{aspect-ratio:16/9;background:var(--surface);border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);margin:40px 0;text-align:center;padding:16px}
.sec{display:grid;grid-template-columns:220px 1fr;gap:16px 48px;padding:36px 0;border-bottom:1px solid var(--line)}
.sec h3{font-size:24px}
.sec p{margin:0 0 14px;max-width:62ch}
.next{display:block;padding:48px 0 24px;text-decoration:none}
.next span{color:var(--muted)}
.next strong{display:block;font:700 clamp(28px,5vw,48px) "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:6px}
.next:hover strong{color:var(--accent)}
.about{display:grid;grid-template-columns:1fr 320px;gap:56px;padding:32px 0 56px}
.about h1{font-size:clamp(38px,7vw,72px);margin-bottom:28px}
.about p{max-width:60ch}
.portrait{aspect-ratio:4/5;background:var(--surface);border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px}
.about h2{font-size:24px;margin:36px 0 12px}
.about ul{padding:0;margin:0;list-style:none}
.about li{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.about li span{color:var(--muted)}
.btn{display:inline-block;margin-top:20px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);border-radius:8px;text-decoration:none;font-weight:500}
.btn:hover{filter:brightness(1.1)}
footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 0 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:15px}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
.fade{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:760px){
  .sec,.about{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}.row .meta{text-align:left;padding:0}
  .hero{padding-top:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="name" href="#work" data-go="work">Claire [Last name]</a>
    <nav aria-label="Main">
      <a href="#work" data-go="work">Work</a>
      <a href="#about" data-go="about">About</a>
      <a href="mailto:you@example.com">Contact</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>
    <span>© 2026 Claire [Last name]</span>
    <span><a href="mailto:you@example.com">you@example.com</a> &nbsp; <a href="https://www.linkedin.com/in/your-profile">LinkedIn</a></span>
  </footer>
</div>
<script>
var CASES=[
 {id:"case-1",title:"[Project name one]",blurb:"[One sentence on the problem you solved and the result.]",meta:"[Company], 2026",
  lede:"[Two sentences: what the product is, who it serves, and the outcome you drove.]",
  facts:[["Role","Staff Product Designer"],["Team","[PM, engineers, researcher]"],["Timeline","[e.g. 6 months]"],["Platform","[Web app]"]]},
 {id:"case-2",title:"[Project name two]",blurb:"[One sentence on the problem you solved and the result.]",meta:"[Company], 2025",
  lede:"[Two sentences: what the product is, who it serves, and the outcome you drove.]",
  facts:[["Role","[Your role]"],["Team","[Team makeup]"],["Timeline","[Duration]"],["Platform","[Platform]"]]},
 {id:"case-3",title:"[Project name three]",blurb:"[One sentence on the problem you solved and the result.]",meta:"[Company], 2024",
  lede:"[Two sentences: what the product is, who it serves, and the outcome you drove.]",
  facts:[["Role","[Your role]"],["Team","[Team makeup]"],["Timeline","[Duration]"],["Platform","[Platform]"]]}
];
var SECTIONS=[
 ["Context","[Describe the product, the users, and what was at stake. Keep it to one short paragraph.]"],
 ["Problem","[State the problem in the users’ terms. Include the evidence: research, support tickets, metrics.]"],
 ["Approach","[Explain how you framed the work and the key decisions you made. Name the options you rejected and why.]"],
 ["Solution","[Show and describe the final design. Walk through the two or three moments that matter most.]"],
 ["Outcome","[Share what changed: adoption, task success, time saved, or what you learned if metrics aren’t available.]"]
];
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function home(){
  return '<section class="hero fade"><h1>Staff Product Designer for B2B SaaS</h1>'+
  '<p>[One or two sentences on what you design and for whom. For example: complex data products that technical teams rely on every day.]</p>'+
  '<div class="status"><span class="dot" aria-hidden="true"></span>[Your availability, or delete this line]</div></section>'+
  '<section class="work" aria-label="Selected work">'+CASES.map(function(c){
    return '<a class="row" href="#'+c.id+'" data-go="'+c.id+'"><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.blurb)+'</p></div><div class="meta">'+esc(c.meta)+'</div></a>';
  }).join("")+'</section>';
}
function about(){
  return '<section class="about fade"><div><h1>About</h1>'+
  '<p>I’m Claire, a Staff Product Designer. [Write two or three sentences about your path, what you care about, and how you work with product and engineering.]</p>'+
  '<p>[Add a short paragraph on the kinds of problems you like most.]</p>'+
  '<h2>Experience</h2><ul><li>[Company]<span>[Years]</span></li><li>[Company]<span>[Years]</span></li><li>[Company]<span>[Years]</span></li></ul>'+
  '<a class="btn" href="mailto:you@example.com">Email me</a></div>'+
  '<div class="portrait" role="img" aria-label="Portrait placeholder">[Add a portrait photo]</div></section>';
}
function kase(i){
  var c=CASES[i],n=CASES[(i+1)%CASES.length];
  return '<a class="crumb" href="#work" data-go="work">Back to work</a>'+
  '<section class="case-head fade"><h1>'+esc(c.title)+'</h1><p class="lede">'+esc(c.lede)+'</p><dl class="facts">'+
  c.facts.map(function(f){return '<div><dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd></div>'}).join("")+'</dl></section>'+
  '<div class="shot" role="img" aria-label="Hero image placeholder">[Add a hero image of the final design]</div>'+
  SECTIONS.map(function(s){return '<section class="sec"><h3>'+s[0]+'</h3><div><p>'+s[1]+'</p></div></section>'}).join("")+
  '<a class="next" href="#'+n.id+'" data-go="'+n.id+'"><span>Next project</span><strong>'+esc(n.title)+'</strong></a>';
}
function render(){
  var h=(location.hash||"#work").slice(1),html,cur="work",t="Claire | Staff Product Designer, B2B SaaS";
  var idx=CASES.map(function(c){return c.id}).indexOf(h);
  if(h==="about"){html=about();cur="about";t="About | Claire"}
  else if(idx>-1){html=kase(idx);cur="";t=CASES[idx].title+" | Claire"}
  else html=home();
  app.innerHTML=html;document.title=t;
  document.querySelectorAll("nav a[data-go]").forEach(function(a){a.removeAttribute("aria-current");if(a.dataset.go===cur)a.setAttribute("aria-current","page")});
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-go]");if(!a)return;
  e.preventDefault();
  try{location.hash=a.dataset.go}catch(x){}
  render();
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
